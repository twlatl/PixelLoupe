# Builds PixelLoupe and runs its unit tests on every pull request to main, and on pushes to main.
# Free on GitHub-hosted standard runners once the repository is public.
#
# A run whose code has already passed skips the build and tests (RAW-293). Each run that passes saves a marker artifact
# named after the tree it tested, ci-passed-<tree hash>; a later run of the same tree finds it and finishes in seconds.
# That's what happens when the rest of a stack of pull requests is rebased after one of them merges, and on the push to
# main a merge makes: their trees are the ones the pull requests already tested. The trees are of the commits checked
# out, which for a pull request is its merge with main. Only markers from runs of this repository's own branches count,
# not a fork's. A manual run (workflow_dispatch) always builds and tests.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to look for an earlier run's ci-passed marker

# A newer push to the same pull request (or branch) cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The Xcode the project is developed with (README: Xcode 27.2 or later).
  XCODE: /Applications/Xcode_27.2.app

jobs:
  build-and-test:
    name: Build and test
    # GitHub's macOS 27 image with Xcode 27 (a public preview). Not the -xlarge variant, which is billed.
    runs-on: xcode-27
    # A clean run takes about 10 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Look for an earlier run that passed this tree
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "A manual run always builds and tests."
            exit 0
          fi
          # If the lookup fails, the run builds and tests as usual.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPOSITORY_ID)][0].workflow_run.id // empty" \
            || true)
          if [[ -n "$run" ]]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tree $tree already passed in $url, so this run skips the build and tests."
            echo "Tree \`$tree\` already passed in [run $run]($url), so this run skipped the build and tests." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tree $tree hasn't passed before."
          fi

      - name: Select Xcode
        if: steps.tested.outputs.skip != 'true'
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install the Metal Toolchain
        if: steps.tested.outputs.skip != 'true'
        # Photo Merge's Core Image kernels (.ci.metal) need it; the image doesn't include it.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build and run the unit tests
        if: steps.tested.outputs.skip != 'true'
        # - Ad-hoc signed ("Sign to Run Locally"): no signing identity is needed. The project's development team (for
        #   signed, notarized builds) is cleared, since the runner has no certificate for it.
        # - Warnings fail the build (SKILLS.md: no build warnings).
        # - UI tests are left out: they need an interactive session and are flaky in CI.
        # - Left out because CI's virtual machines can't run them reliably: the large-catalog performance test (it
        #   measures speed) and the three tests that wait for a photo to decode in Develop (Navigator zoom, preset
        #   amount, preset hover), which take over a minute each there (RAW-111). They still run locally.
        # - Each test gets 2 minutes (at most 4, if it asks): a test that hangs is stopped and reported by name instead
        #   of stalling the run until the job's time limit. The unit tests run one at a time (the scheme's
        #   PixelLoupeTests isn't parallelizable): nearly all of them need the main actor, so running them in parallel
        #   saved almost nothing and made each test's clock count its wait for the others (RAW-111).
        # - The runner's display is 1024 x 768: layout tests use TestWindow (PixelLoupeTests/TestSupport.swift) so a
        #   small screen doesn't squeeze their windows.
        run: |
          set -o pipefail
          xcodebuild test \
            -project PixelLoupe.xcodeproj \
            -scheme PixelLoupe \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:PixelLoupeUITests \
            -skip-testing:'PixelLoupeTests/LargeCatalogPerformanceTests/syntheticCatalog()' \
            -skip-testing:'PixelLoupeTests/NavigatorZoomTests/developZoomsAndPublishesWhatShows()' \
            -skip-testing:'PixelLoupeTests/PresetAmountDevelopTests/theAmountSliderScalesThePresetAndEndsWithAnotherEdit()' \
            -skip-testing:'PixelLoupeTests/PresetHoverTests/hoveringPreviewsWithoutChangingThePhoto()' \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 240 \
            DEVELOPMENT_TEAM= \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 14

      - name: Write the ci-passed marker
        if: steps.tested.outputs.skip != 'true'
        env:
          TREE: ${{ steps.tested.outputs.tree }}
        run: |
          mkdir -p build/ci-passed
          printf 'tree %s\ncommit %s\nrun %s\n' "$TREE" "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/ci-passed/ci-passed.txt

      - name: Save the ci-passed marker
        if: steps.tested.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ steps.tested.outputs.tree }}
          path: build/ci-passed/ci-passed.txt
          retention-days: 30
